name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Code
        run: |
          cd frontend
          npm run lint

      - name: Run Unit & API Tests
        run: |
          cd frontend
          npm run test

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

      - name: Verify No Secrets In Client Bundle
        run: |
          ! grep -rE "AIza[0-9A-Za-z-_]{35}|gsk_[a-zA-Z0-9]{32}|sk-[a-zA-Z0-9]{32}" frontend/dist/
